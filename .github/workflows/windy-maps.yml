name: Render MHMC Windy Weather Maps

on:
  workflow_dispatch:
  schedule:
    # 05:30 UTC = 07:30 Egypt time. Report cron is 08:05 Egypt.
    - cron: '30 5 * * *'

permissions:
  contents: write

concurrency:
  group: mhmc-windy-maps
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          playwright install --with-deps chromium

      - name: Render Windy maps
        env:
          WINDY_MAP_LAT: '29.8'
          WINDY_MAP_LON: '31.0'
          WINDY_MAP_ZOOM: '6'
          WINDY_MAP_WIDTH: '1400'
          WINDY_MAP_HEIGHT: '760'
          WINDY_MAP_WAIT_MS: '25000'
          WINDY_OUTPUT_DIR: weather-maps
          WINDY_MIN_IMAGE_BYTES: '10000'
        run: python tools/render_windy_maps.py

      - name: Publish generated maps
        run: |
          git config user.name 'MHMC Windy Renderer'
          git config user.email 'actions@users.noreply.github.com'
          git add weather-maps
          git diff --cached --quiet || git commit -m "Update MHMC Windy weather maps"
          git push
